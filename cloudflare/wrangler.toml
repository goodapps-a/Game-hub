name = "eyvan-hokm-online"
main = "src/index.ts"
compatibility_date = "2026-01-15"

[vars]
# Grace period (ms) to hold a disconnected player's seat before closing the room
DISCONNECT_GRACE_MS = "90000"
# TTL (ms) before a CLOSED room's Durable Object storage is purged automatically
ROOM_CLEANUP_TTL_MS = "300000"
# REQUIRED FOR PRODUCTION: Comma-separated frontend origins (e.g. "https://eyvan.example.com,https://www.eyvan.example.com")
# Never use "*" — leave empty ONLY for localhost development.
ALLOWED_ORIGINS = ""
# OPTIONAL FOR CROSS-SUBDOMAIN PRODUCTION (e.g. play.example.com + api.example.com):
# Set COOKIE_DOMAIN = ".example.com" so both set and clear cookies share the exact parent domain.
# COOKIE_DOMAIN = ""
# Set ENVIRONMENT = "production" on production deploys
ENVIRONMENT = "production"
# Public frontend origin used inside verification & password reset links (e.g. "https://eyvan.example.com")
PUBLIC_APP_URL = ""
# Transactional email provider for C2 (configure RESEND_API_KEY via `wrangler secret put RESEND_API_KEY`, NEVER commit keys)
EMAIL_PROVIDER = "resend"
EMAIL_FROM = "Eyvan <no-reply@example.com>"


[[durable_objects.bindings]]
name = "HOKM_ROOM"
class_name = "HokmRoomDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HokmRoomDO"]

[[d1_databases]]
binding = "EYVAN_DB"
database_name = "eyvan-hokm-db"
# MANUAL SETUP REQUIRED: Run `wrangler d1 create eyvan-hokm-db` and paste the real UUID below
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "EYVAN_ASSETS"
bucket_name = "eyvan-assets"
