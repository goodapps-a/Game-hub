name = "eyvan-hokm-online"
main = "src/index.ts"
compatibility_date = "2026-01-15"

[vars]
# Grace period (ms) to hold a disconnected player's seat before closing the room
DISCONNECT_GRACE_MS = "90000"
# TTL (ms) before a CLOSED room's Durable Object storage is purged automatically
ROOM_CLEANUP_TTL_MS = "300000"
# REQUIRED FOR PRODUCTION: Exact comma-separated HTTPS frontend origins (e.g. "https://play.your-real-domain.ir")
# Never use "*", "*.run.app", localhost, or example.com.
ALLOWED_ORIGINS = ""
# OPTIONAL FOR CROSS-SUBDOMAIN PRODUCTION (e.g. play.your-domain.ir + api.your-domain.ir):
# Set COOKIE_DOMAIN = ".your-domain.ir" so both set and clear cookies share the exact parent domain.
# COOKIE_DOMAIN = ""
# Set ENVIRONMENT = "production" on production deploys
ENVIRONMENT = "production"
# REQUIRED FOR PRODUCTION: Public HTTPS frontend origin used inside verification & password reset links
PUBLIC_APP_URL = ""
# Transactional email provider for C2:
# 1) Configure RESEND_API_KEY via `wrangler secret put RESEND_API_KEY` (NEVER commit secrets here)
# 2) Set EMAIL_FROM below to a Resend-verified sender on your real domain (e.g. "Eyvan <no-reply@your-real-domain.ir>")
EMAIL_PROVIDER = "resend"
EMAIL_FROM = ""


[[durable_objects.bindings]]
name = "HOKM_ROOM"
class_name = "HokmRoomDO"

[[durable_objects.bindings]]
name = "CHAT_CONVERSATION"
class_name = "ChatConversationDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HokmRoomDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["ChatConversationDO"]

[[d1_databases]]
binding = "EYVAN_DB"
database_name = "eyvan-hokm-db"
database_id = "aceb2de4-d98a-4739-9f62-786dcbb023d9"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "EYVAN_ASSETS"
bucket_name = "eyvan-assets"

# Periodic low-cost cleanup for expired, unblocked `auth_rate_limits` rows (runs every 6 hours, bounded batches)
[triggers]
crons = ["0 */6 * * *"]
