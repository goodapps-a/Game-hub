  <!-- Minimal royal lapis rounded tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#aura)" />

  <!-- Crisp hairline architectural inner border -->
  <rect x="30" y="30" width="452" height="452" rx="88" stroke="url(#gold)" stroke-width="6" stroke-opacity="0.42" />

  <!-- Minimalist Persian Pointed Iwan Arch -->
  <path
    d="M126 396V248C126 174 184 122 256 94C328 122 386 174 386 248V396"
