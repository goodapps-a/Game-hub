<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="bg" x1="40" y1="24" x2="472" y2="488" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#13294B" />
      <stop offset="55%" stop-color="#0B182E" />
      <stop offset="100%" stop-color="#07101F" />
    </linearGradient>
    <radialGradient id="aura" cx="50%" cy="46%" r="48%">
      <stop offset="0%" stop-color="#148A8A" stop-opacity="0.34" />
      <stop offset="65%" stop-color="#0D8A8A" stop-opacity="0.08" />
