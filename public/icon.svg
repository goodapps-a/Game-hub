  />
  <circle cx="256" cy="264" r="18" fill="#0B182E" />
  <circle cx="256" cy="264" r="7" fill="#2CC5BE" />

  <!-- Architectural Base Plinth -->
  <line
    x1="104"
    y1="396"
    x2="408"
