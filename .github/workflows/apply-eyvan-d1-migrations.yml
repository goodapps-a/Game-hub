name: Apply Eyvan D1 Remote Migrations

on:
  workflow_dispatch:
    inputs:
      confirm_apply:
        description: 'Select "yes" to apply Cloudflare D1 migrations to remote eyvan-hokm-db'
        required: true
        type: choice
        default: 'no'
        options:
          - 'no'
          - 'yes'

permissions:
  contents: read

concurrency:
  group: eyvan-d1-remote-migrations
  cancel-in-progress: false

jobs:
  apply-d1-migrations:
    name: Apply Remote D1 Migrations (eyvan-hokm-db)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: cloudflare
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify manual confirmation
        if: ${{ inputs.confirm_apply != 'yes' }}
        run: |
          echo "::error::Migration aborted: confirm_apply must be explicitly set to 'yes'."
          exit 1

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate required Cloudflare secrets and 15 migration files
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [[ -z "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            echo "::error::Missing required GitHub Secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]]; then
            echo "::error::Missing required GitHub Secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          if [[ ! -f "wrangler.toml" ]]; then
            echo "::error::cloudflare/wrangler.toml not found"
            exit 1
          fi
          if [[ ! -d "migrations" ]]; then
            echo "::error::cloudflare/migrations directory not found"
            exit 1
          fi
          shopt -s nullglob
          migration_files=(migrations/*.sql)
          file_count="${#migration_files[@]}"
          echo "Found ${file_count} migration file(s) in cloudflare/migrations:"
          printf ' - %s\n' "${migration_files[@]}"
          if [[ "${file_count}" -ne 15 ]]; then
            echo "::error::Expected exactly 15 migration files in cloudflare/migrations, but found ${file_count}."
            exit 1
          fi

      - name: Apply remote D1 migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply eyvan-hokm-db --remote

      - name: Verify applied migrations count (must be 15), exact filenames, and created tables
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CI: 'true'
        run: |
          set -euo pipefail
          echo "=== d1_migrations record count ==="
          count_json="$(npx --yes wrangler@4 d1 execute eyvan-hokm-db --remote --json --command "SELECT COUNT(*) AS applied_migrations_count FROM d1_migrations;")"
          echo "${count_json}"
          applied_count="$(node -e '
            const raw = process.argv[1];
            const parsed = JSON.parse(raw);
            const first = Array.isArray(parsed) ? parsed[0] : parsed;
            const row = first && Array.isArray(first.results) ? first.results[0] : null;
            const val = row ? Number(row.applied_migrations_count) : NaN;
            if (!Number.isInteger(val)) {
              console.error("Failed to parse applied_migrations_count from wrangler output");
              process.exit(1);
            }
            process.stdout.write(String(val));
          ' "${count_json}")"
          echo "Verified d1_migrations count: ${applied_count}"
          if [[ "${applied_count}" -ne 15 ]]; then
            echo "::error::Expected exactly 15 applied migrations in d1_migrations, but found ${applied_count}."
            exit 1
          fi

          echo "=== Verify exact 15 migration filenames against cloudflare/migrations ==="
          names_json="$(npx --yes wrangler@4 d1 execute eyvan-hokm-db --remote --json --command "SELECT name FROM d1_migrations;")"
          node -e '
            const fs = require("node:fs");
            const raw = process.argv[1];
            const parsed = JSON.parse(raw);
            const first = Array.isArray(parsed) ? parsed[0] : parsed;
            if (!first || !Array.isArray(first.results)) {
              console.error("::error::Failed to parse d1_migrations rows from wrangler JSON output.");
              process.exit(1);
            }

            const expectedFiles = fs
              .readdirSync("migrations", { withFileTypes: true })
              .filter((entry) => entry.isFile() && entry.name.endsWith(".sql"))
              .map((entry) => entry.name)
              .sort();

            if (expectedFiles.length !== 15) {
              console.error(`::error::Expected exactly 15 SQL files in cloudflare/migrations, found ${expectedFiles.length}.`);
              process.exit(1);
            }

            const appliedNames = first.results.map((r) => (r && typeof r.name === "string" ? r.name : ""));
            if (appliedNames.length !== 15 || appliedNames.some((n) => !n)) {
              console.error(`::error::Expected 15 valid migration names in d1_migrations, found ${appliedNames.length}.`);
              process.exit(1);
            }

            const seen = new Set();
            const duplicates = [];
            for (const name of appliedNames) {
              if (seen.has(name)) duplicates.push(name);
              seen.add(name);
            }

            const expectedSet = new Set(expectedFiles);
            const missing = expectedFiles.filter((name) => !seen.has(name));
            const extra = Array.from(seen).filter((name) => !expectedSet.has(name));

            if (duplicates.length > 0 || missing.length > 0 || extra.length > 0) {
              if (duplicates.length > 0) {
                console.error(`::error::Duplicate migration names in d1_migrations: ${duplicates.join(", ")}`);
              }
              if (missing.length > 0) {
                console.error(`::error::Missing migrations in d1_migrations: ${missing.join(", ")}`);
              }
              if (extra.length > 0) {
                console.error(`::error::Unexpected/extra migrations in d1_migrations: ${extra.join(", ")}`);
              }
              process.exit(1);
            }

            console.log("All 15 migrations verified successfully");
          ' "${names_json}"

          echo "=== Applied migration records in d1_migrations ==="
          npx --yes wrangler@4 d1 execute eyvan-hokm-db --remote --command "SELECT id, name, applied_at FROM d1_migrations ORDER BY id ASC;"
          echo "=== Remote D1 created tables ==="
          npx --yes wrangler@4 d1 execute eyvan-hokm-db --remote --command "SELECT name FROM sqlite_master WHERE type = 'table' AND name NOT LIKE 'sqlite_%' AND name NOT LIKE '_cf_%' ORDER BY name ASC;"
